<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downstage — Collaboration</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#12100c;--bg-2:#161310;--ink:#ece3d2;--dim:rgba(236,227,210,.62);--faint:rgba(236,227,210,.38);--hair:rgba(236,227,210,.14);--red:#e04a21;--amber:#e6a03f;--serif:"Fraunces",Georgia,serif;--mono:"Space Mono",monospace}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font:390 16px/1.6 var(--serif);padding:132px clamp(18px,5vw,72px) 60px}main{max-width:1180px;margin:auto}.site-head{position:fixed;inset:0 0 auto 0;z-index:10;background:rgba(18,16,12,.92);border-bottom:1px solid var(--hair)}.head-in{display:flex;align-items:center;gap:32px;height:92px;max-width:1180px;margin:auto;padding:0 clamp(18px,5vw,72px)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto}.brand-mark{width:110px;height:auto;max-height:58px;object-fit:contain}.brand-name{font:900 1.75rem var(--serif);color:#fff}.brand-loc{font:9.5px var(--mono);letter-spacing:.32em;color:var(--red);margin-top:5px}.main-nav{display:flex;gap:30px}.main-nav a{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--dim)}.main-nav a:hover{color:var(--ink)}.head-right{display:flex;align-items:center;gap:16px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);background:none;color:var(--ink);font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:12px 18px;text-decoration:none;cursor:pointer}.btn:hover{background:var(--ink);color:var(--bg)}.head-cta{width:160px}.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--hair);padding-bottom:18px;margin-bottom:54px;font:10px var(--mono);letter-spacing:.2em;color:#fff;text-transform:uppercase}.topline a{color:#fff;text-decoration:none}.sec-head{display:grid;grid-template-columns:1fr 1.5fr .8fr;gap:24px;align-items:end;border-bottom:1px solid var(--hair);padding-bottom:28px;margin-bottom:38px}.sec-kicker{display:flex;gap:14px;font:10px var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}.sec-kicker b{color:var(--red);font-weight:400}.sec-title{font:430 clamp(2.4rem,6vw,5.5rem)/.96 var(--serif)}.sec-title em{color:var(--amber);font-style:italic}.sec-side{text-align:right;font:10px/1.8 var(--mono);letter-spacing:.12em;color:var(--faint)}.collab-form{max-width:900px}.question-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 28px}.question{display:block;font:10px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}.question input,.question textarea{display:block;width:100%;margin-top:8px;background:#fff;border:1px solid rgba(8,7,5,.18);color:#17130f;font:400 1.05rem var(--serif);padding:12px;outline:none}.question textarea{resize:vertical;min-height:132px}.question input:focus,.question textarea:focus{border-color:var(--red)}.wide{grid-column:1/-1}.section-label{grid-column:1/-1;border-top:1px solid var(--hair);padding-top:28px;margin-top:8px;color:var(--red);font:10px var(--mono);letter-spacing:.22em;text-transform:uppercase}.actions{margin-top:30px;display:flex;justify-content:flex-end}.solid{background:var(--ink);color:var(--bg)}.back-link{display:block;margin-top:42px;color:var(--amber);font:10px var(--mono);letter-spacing:.16em;text-decoration:none;text-transform:uppercase}.back-link:hover{color:var(--ink)}@media(max-width:760px){body{padding-top:88px}.head-in{height:72px}.brand-mark{width:84px}.brand-name{font-size:1.35rem}.brand-loc{font-size:8px}.main-nav,.head-right{display:none}.sec-head{grid-template-columns:1fr;gap:14px}.sec-side{text-align:left}.question-grid{grid-template-columns:1fr}.wide,.section-label{grid-column:auto}.section-label{margin-top:8px}}
</style>
<style>.sec-title{white-space:nowrap;font-size:clamp(2.1rem,5vw,5.5rem)}@media(max-width:760px){.sec-title{font-size:clamp(2rem,10vw,3.5rem)}}</style>
</head>
<body>
<header class="site-head"><div class="head-in"><a class="brand" href="https://downstagerabat.github.io/stage/" aria-label="Downstage — home"><img class="brand-mark" src="images/logo.png" alt="Downstage"><span class="brand-name">Downstage</span><span class="brand-loc">RABAT</span></a><nav class="main-nav" aria-label="Main"><a href="program.html">Program</a><a href="rehearsal.html">Rehearsals</a><a href="stage.html">STAGE</a><a href="https://downstagerabat.github.io/stage/#story">Story</a><a href="https://downstagerabat.github.io/stage/#visit">Visit</a></nav><div class="head-right"><a class="btn head-cta" href="collaboration.html">Collaborate with us</a><a class="btn head-cta" href="membership.html">Membership Club</a></div></div></header>
<main>
  <div class="topline"><a href="https://downstagerabat.github.io/stage/">Downstage</a><span>Rabat · Collaboration</span></div>
  <section>
    <header class="sec-head"><p class="sec-kicker"><b>(07)</b><span>COLLABORATE</span></p><h1 class="sec-title">Let's create <em>together</em>.</h1><p class="sec-side">ARTISTS · BRANDS<br>PROJECTS · PARTNERSHIPS</p></header>
    <form class="collab-form" id="collabForm" action="https://formsubmit.co/ajax/downstage.rabat@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New Downstage collaboration request"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false">
      <div class="question-grid">
        <label class="question wide">1. Name / Artist or Organization Name<input name="name_or_organization" required></label>
        <label class="question">2. Contact email<input type="email" name="email" required></label>
        <label class="question">3. Phone / WhatsApp<input type="tel" name="phone_whatsapp" required></label>
        <label class="question">4. Instagram / Website / Social media<input name="social_media"></label>
        <label class="question wide">5. What do you do? <span>(Artist, band, producer, comedian, promoter, collective, brand, etc.)</span><textarea name="what_you_do" rows="3" required></textarea></label>
        <p class="section-label">About the collaboration</p>
        <label class="question wide">6. What would you like to collaborate with us on?<textarea name="collaboration_type" rows="4" required></textarea></label>
        <label class="question wide">7. Tell us briefly about your project or idea.<textarea name="project_or_idea" rows="5" required></textarea></label>
        <label class="question wide">8. Why would you like to collaborate with Downstage?<textarea name="why_downstage" rows="4" required></textarea></label>
        <label class="question wide">9. What are you looking for from us? <span>(Venue / production / promotion / equipment / partnership / other)</span><textarea name="looking_for" rows="4" required></textarea></label>
        <label class="question wide">10. Anything else you'd like us to know?<textarea name="anything_else" rows="4"></textarea></label>
      </div>
      <div class="actions"><button class="btn solid" type="submit">Send collaboration request</button></div>
    </form>
  </section>
  <a class="back-link" href="https://downstagerabat.github.io/stage/">← Back to Downstage</a>
</main>
<script>
const form=document.querySelector('#collabForm');
form.addEventListener('submit',async event=>{event.preventDefault();if(!form.checkValidity()){form.reportValidity();return}const button=form.querySelector('button');button.disabled=true;try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(!response.ok)throw new Error('Request failed');const result=await response.json();if(result.success===false||result.success==='false')throw new Error('Form activation required');form.reset();button.textContent='Request sent';}catch(error){button.textContent='Please try again';}finally{button.disabled=false}});
</script>
</body>
</html>

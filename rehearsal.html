<style>
:root{--bg:#12100c;--bg-2:#161310;--ink:#ece3d2;--dim:rgba(236,227,210,.62);--faint:rgba(236,227,210,.38);--hair:rgba(236,227,210,.14);--red:#e04a21;--amber:#e6a03f;--serif:"Fraunces",Georgia,serif;--mono:"Space Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font:390 16px/1.6 var(--serif);padding:132px clamp(18px,5vw,72px) 60px}main{max-width:1180px;margin:auto}.site-head{position:fixed;inset:0 0 auto 0;z-index:10;background:rgba(18,16,12,.92);border-bottom:1px solid var(--hair)}.head-in{display:flex;align-items:center;gap:32px;height:92px;max-width:1180px;margin:auto;padding:0 clamp(18px,5vw,72px)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto}.brand-mark{width:110px;height:auto;max-height:58px;object-fit:contain}.brand-name{font:900 1.75rem var(--serif);color:#fff}.brand-loc{font:9.5px var(--mono);letter-spacing:.32em;color:var(--red);margin-top:5px}.main-nav{display:flex;gap:30px}.main-nav a{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--dim)}.main-nav a:hover{color:var(--ink)}.head-right{display:flex;align-items:center;gap:16px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);background:none;color:var(--ink);font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:12px 18px;text-decoration:none;cursor:pointer}.btn:hover{background:var(--ink);color:var(--bg)}.head-cta{width:160px}.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--hair);padding-bottom:18px;margin-bottom:28px;font:10px var(--mono);letter-spacing:.2em;color:#fff;text-transform:uppercase}.topline a{color:#fff;text-decoration:none}.back-link{display:block;margin-top:30px;color:var(--amber);font:10px var(--mono);letter-spacing:.16em;text-decoration:none;text-transform:uppercase}.back-link:hover{color:var(--ink)}.sec-head{display:grid;grid-template-columns:1fr 1.5fr .8fr;gap:24px;align-items:end;border-bottom:1px solid var(--hair);padding-bottom:28px;margin-bottom:38px}.sec-kicker{display:flex;gap:14px;font:10px var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}.sec-kicker b{color:var(--red);font-weight:400}.sec-title{font:430 clamp(2.4rem,6vw,5.5rem)/.96 var(--serif);letter-spacing:-.02em}.sec-title em{color:var(--amber);font-style:italic}.sec-side{text-align:right;font:10px/1.8 var(--mono);letter-spacing:.12em;color:var(--faint)}.rehearsal-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start}.kicker{border-top:1px solid var(--hair);padding-top:26px;font:10px var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}.pack-list{display:grid;gap:12px;margin-top:18px}.pack-card{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--hair);padding:20px 22px;background:var(--bg-2);cursor:pointer}.pack-card:has(input:checked){border-color:var(--amber);background:rgba(230,160,63,.06)}.pack-card input{position:absolute;opacity:0}.pack-name{font:500 1.25rem var(--serif)}.pack-hours{display:block;margin-top:5px;font:10px var(--mono);letter-spacing:.16em;color:var(--dim)}.pack-price{font:700 1.15rem var(--mono);color:var(--amber);white-space:nowrap}.rehearsal-form{border-top:1px solid var(--hair);padding-top:26px}.rehearsal-form h2{font:italic 400 1.65rem var(--serif);margin-bottom:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field label{display:block;margin-bottom:8px;font:11px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase}.field input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair);color:var(--ink);font:400 1.05rem var(--serif);padding:10px 2px;outline:none}.field input:focus{border-color:var(--amber)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.solid{background:var(--ink);color:var(--bg)}@media(max-width:760px){body{padding-top:88px}.head-in{height:72px}.brand-mark{width:84px}.brand-name{font-size:1.35rem}.brand-loc{font-size:8px}.main-nav,.head-right{display:none}.sec-head,.rehearsal-grid{grid-template-columns:1fr;gap:24px}.sec-side{text-align:left}.fields{grid-template-columns:1fr}.pack-card{padding:16px}.topline{margin-bottom:42px}}
</style>
</head>
<body>
<header class="site-head"><div class="head-in"><a class="brand" href="https://downstagerabat.github.io/stage/" aria-label="Downstage — home"><img class="brand-mark" src="images/logo.png" alt="Downstage"><span class="brand-name">Downstage</span><span class="brand-loc">RABAT</span></a><nav class="main-nav" aria-label="Main"><a href="program.html">Program</a><a href="rehearsal.html">Rehearsals</a><a href="https://downstagerabat.github.io/stage/#room">STAGE</a><a href="https://downstagerabat.github.io/stage/#story">Story</a><a href="https://downstagerabat.github.io/stage/#visit">Visit</a></nav><div class="head-right"><a class="btn head-cta" href="https://forms.gle/nJm9DmAewahU4h7V6" target="_blank" rel="noopener noreferrer">Collaborate</a><a class="btn head-cta" href="program.html">Reserve a seat</a></div></div></header>
<main>
  <div class="topline"><a href="https://downstagerabat.github.io/stage/">Downstage</a><span>Rabat · Rehearsals</span></div>
  <section>
    <header class="sec-head"><p class="sec-kicker"><b>(02)</b><span>REHEARSALS</span></p><h1 class="sec-title">Book your <em>Space</em>.</h1><p class="sec-side">PRACTICE · CREATE<br>THE STAGE IS YOURS</p></header>
    <div class="rehearsal-grid">
      <div><div class="kicker">Choose a pack</div><div class="pack-list"><label class="pack-card"><input type="radio" name="pack" value="Pack Starter — 900 DHS" checked><span><span class="pack-name">Pack Starter</span><span class="pack-hours">10 HOURS</span></span><span class="pack-price">900 DHS</span></label><label class="pack-card"><input type="radio" name="pack" value="Pack Regular — 1,700 DHS"><span><span class="pack-name">Pack Regular</span><span class="pack-hours">20 HOURS</span></span><span class="pack-price">1,700 DHS</span></label><label class="pack-card"><input type="radio" name="pack" value="Pack Pro — 2,400 DHS"><span><span class="pack-name">Pack Pro</span><span class="pack-hours">30 HOURS</span></span><span class="pack-price">2,400 DHS</span></label></div></div>
      <form class="rehearsal-form" action="https://formsubmit.co/ajax/downstage.rabat@gmail.com" method="POST"><input type="hidden" name="_subject" value="New rehearsal reservation request"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><h2>Reserve a rehearsal session</h2><div class="fields"><div class="field"><label for="day">Day</label><input id="day" name="day" type="date"></div><div class="field"><label for="time">Time</label><input id="time" name="time" type="time"></div></div><div class="field" style="margin-top:20px"><label for="hours">How many hours?</label><input id="hours" name="hours" type="number" min="1" max="30" value="1" required></div><div class="field" style="margin-top:20px"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Band or artist name" required></div><div class="fields" style="margin-top:20px"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" placeholder="06 00 00 00 00" required></div></div><div class="actions"><button class="btn" type="submit" name="requestType" value="Hourly rehearsal session">Request hourly session</button><button class="btn solid" type="submit" name="requestType" value="Pack offer purchase">Buy pack offer</button></div></form>
    </div>
  </section>
  <a class="back-link" href="https://downstagerabat.github.io/stage/">← Back to Downstage</a>
</main>
</body>

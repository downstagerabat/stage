<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downstage — Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#12100c;--bg-2:#161310;--ink:#ece3d2;--dim:rgba(236,227,210,.62);--faint:rgba(236,227,210,.38);--hair:rgba(236,227,210,.14);--red:#e04a21;--amber:#e6a03f;--serif:"Fraunces",Georgia,serif;--mono:"Space Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);font:390 16px/1.6 var(--serif);padding:clamp(28px,6vw,88px) clamp(18px,5vw,72px)}main{max-width:1180px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--hair);padding-bottom:18px;margin-bottom:clamp(48px,9vw,110px);font:10px var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}.topline a{color:var(--ink);text-decoration:none}.topline a:hover{color:var(--amber)}.sec-head{display:grid;grid-template-columns:1fr 1.5fr .8fr;gap:24px;align-items:end;border-bottom:1px solid var(--hair);padding-bottom:28px;margin-bottom:10px}.sec-kicker{display:flex;gap:14px;font:10px var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}.sec-kicker b{color:var(--red);font-weight:400}.sec-title{font:430 clamp(2.4rem,6vw,5.5rem)/.96 var(--serif);letter-spacing:-.02em}.sec-title em{color:var(--amber);font-style:italic}.sec-side{text-align:right;font:10px/1.8 var(--mono);letter-spacing:.12em;color:var(--faint)}.show{position:relative;border-bottom:1px solid var(--hair)}.show-head{width:100%;display:grid;grid-template-columns:104px 1fr 172px 108px 56px;align-items:center;gap:20px;padding:25px 10px;background:none;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer}.show-head:hover{background:rgba(236,227,210,.03)}.s-date{display:flex;align-items:baseline;gap:9px;font:10px var(--mono);color:var(--faint)}.s-date b{font:400 2.2rem var(--serif);color:var(--ink)}.s-main{display:grid;gap:4px}.s-artist{font:500 1.2rem var(--serif);text-transform:none}.s-tag,.s-status{font:10px var(--mono);letter-spacing:.12em;color:var(--faint)}.s-status .st{color:var(--amber)}.s-status .st-sold{color:var(--red)}.s-price{font:700 14px var(--mono);color:var(--amber);text-align:right}.s-x{width:34px;height:34px;border:1px solid var(--hair);display:grid;place-items:center;justify-self:end}.s-x svg{width:14px;transition:transform .25s}.show-head[aria-expanded=true] .s-x{border-color:var(--amber)}.show-head[aria-expanded=true] .s-x svg{transform:rotate(45deg)}.show-body{max-height:0;overflow:hidden;transition:max-height .45s ease}.show-body-in{padding:0 10px 26px 124px}.show-desc{max-width:680px;color:var(--dim);font-size:1rem;margin-bottom:16px}.s-actions{display:flex;justify-content:space-between;align-items:center;gap:18px}.s-times{font:10px var(--mono);letter-spacing:.12em;color:var(--faint)}.btn{display:inline-block;border:1px solid var(--amber);padding:10px 15px;color:var(--amber);font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;background:none;cursor:pointer}.btn:hover{background:var(--amber);color:var(--bg)}@media(max-width:760px){.topline{margin-bottom:54px}.sec-head{grid-template-columns:1fr;gap:14px}.sec-side{text-align:left}.show-head{grid-template-columns:58px 1fr 35px;grid-template-areas:"date main x" "date status x" "date price x";gap:6px 12px;padding:20px 0}.s-date{grid-area:date;display:grid;gap:0}.s-date b{font-size:1.9rem}.s-main{grid-area:main}.s-status{grid-area:status}.s-price{grid-area:price;text-align:left}.s-x{grid-area:x}.show-body-in{padding:0 0 24px}.s-actions{align-items:flex-start;flex-direction:column}.s-times{line-height:1.6}}
</style>
<style>
.site-head{position:fixed;inset:0 0 auto 0;z-index:10;background:rgba(18,16,12,.92);border-bottom:1px solid var(--hair)}
.head-in{display:flex;align-items:center;gap:32px;height:92px;max-width:1180px;margin:auto;padding:0 clamp(18px,5vw,72px)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto}.brand-mark{width:110px;height:auto;max-height:58px;object-fit:contain}.brand-name{font:900 1.75rem var(--serif);color:#fff!important}.brand-loc{font:9.5px var(--mono);letter-spacing:.32em;color:var(--red);margin-top:5px}.main-nav{display:flex;gap:30px}.main-nav a{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--dim)}.main-nav a:hover{color:var(--ink)}.head-right{display:flex;align-items:center;gap:16px}.head-cta{width:160px}.back-link{display:block;margin:28px 0 0;color:var(--amber);font:10px var(--mono);letter-spacing:.16em;text-decoration:none;text-transform:uppercase}.back-link:hover{color:var(--ink)}
.topline a,.topline span{color:#fff}
body{padding-top:132px}
@media(max-width:760px){.head-in{height:72px}.brand-mark{width:84px}.brand-name{font-size:1.35rem}.brand-loc{font-size:8px}.main-nav,.head-right{display:none}body{padding-top:88px}.sec-head{grid-template-columns:1fr;gap:14px}.sec-side{text-align:left}.show-head{grid-template-columns:52px minmax(0,1fr) 32px;grid-template-areas:"date main x" "date status x" "date price x";gap:6px 10px;padding:20px 0}.s-date{grid-area:date;display:grid;gap:0}.s-date b{font-size:1.9rem}.s-main{grid-area:main;min-width:0}.s-artist{font-size:1.05rem;line-height:1.15;overflow-wrap:anywhere}.s-tag,.s-status{font-size:9px;line-height:1.4;overflow-wrap:anywhere}.s-status{grid-area:status}.s-price{grid-area:price;text-align:left}.s-x{grid-area:x}.show-body-in{padding:0 0 24px}.s-actions{align-items:flex-start;flex-direction:column}.s-times{line-height:1.6}}
</style>
<style>@media(max-width:760px){.head-in{height:126px;position:relative;align-items:flex-start;padding-top:12px}.head-right{position:absolute;left:18px;right:18px;top:68px;display:flex;gap:8px}.head-cta{display:inline-flex;flex:1;width:auto;padding:9px 6px;font-size:8px;letter-spacing:.08em}body{padding-top:180px}}</style>
<style>.site-head{transition:transform .35s ease,opacity .35s ease}.site-head.nav-hidden{transform:translateY(-100%);opacity:0;pointer-events:none}.program-month{display:block;margin-bottom:12px;color:var(--red);font:14px var(--mono);letter-spacing:.2em;text-transform:uppercase}.show-content{display:grid;grid-template-columns:minmax(180px,320px) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:20px}.show-image{display:block;width:100%;max-height:500px;object-fit:cover;border:1px solid var(--hair)}@media(max-width:760px){.show-content{grid-template-columns:minmax(112px,40%) minmax(0,1fr);gap:14px}.show-image{max-height:280px}}</style>
</head>
<body>
<header class="site-head"><div class="head-in"><a class="brand" href="https://downstagerabat.github.io/stage/" aria-label="Downstage — home"><img class="brand-mark" src="images/logo.png" alt="Downstage"><span class="brand-name">Downstage</span><span class="brand-loc">RABAT</span></a><nav class="main-nav" aria-label="Main"><a href="program.html">Program</a><a href="rehearsal.html">Rehearsals</a><a href="stage.html">STAGE</a><a href="https://downstagerabat.github.io/stage/#story">Story</a><a href="https://downstagerabat.github.io/stage/#visit">Visit</a></nav><div class="head-right"><a class="btn head-cta" href="collaboration.html">Collaborate with us</a><a class="btn head-cta" href="membership.html">Membership Club</a></div></div></header>
<main>
  <div class="topline"><a href="https://downstagerabat.github.io/stage/">Downstage</a><span>Rabat · Live programme</span></div>
  <section id="programme">
    <header class="sec-head"><p class="sec-kicker"><b>(01)</b><span>PROGRAMME</span></p><h1 class="sec-title"><span class="program-month">SEPTEMBER</span>The next <em>nights</em>.</h1><p class="sec-side">TICKETS AT THE DOOR<br>PREBOOKED SEATS HELD TILL 19:00</p></header>
    <div id="showList"></div>
  </section>
  <a class="back-link" href="https://downstagerabat.github.io/stage/">← Back to Downstage</a>
</main>
<script>
const shows=[
  ['2026-09-04','Masterclass — Management & Bookings','SOUMAYA IDBA · IRICO FRANCO','A masterclass focused on music management, covering artist development, career strategy, booking, promotion, and the key tools needed to build a successful career in the music industry.',0,21],
  ['2026-09-10','Jam Session','HOUSE BAND · INABSOLUTE','The night kicks off with a live set by our house band, Inabsolute, before opening the stage to musicians for an evening of improvisation, collaboration, and spontaneous musical moments.',30,30],
  ['2026-09-12','CORE Comedy Club','STAND-UP COMEDY · 4 ACTS','CORE COMEDY CLUB est de retour ! Le CORE Comedy Club revient en force à Rabat pour un spectacle franco-marocain inédit.',100,30,'images/COREECC.png','https://iticket.ma/events/comedy/core-comedy-club-a-rabat'],
  ['2026-09-17','Jam Session','HOUSE BAND · INABSOLUTE','The night kicks off with a live set by our house band, Inabsolute, before opening the stage to musicians for an evening of improvisation, collaboration, and spontaneous musical moments.',30,30],
  ['2026-09-25','Faten Wehebe','STAND-UP COMEDY','Rabat. J’arriiive. Prépare-toi à rire de moi avec moi. Je vais te parler de mes sujets préférés : l’amour (ou son absence), les rencontres (souvent ratées), les ruptures (parfois libératrices), et les joies, disons sportives, d’être dans une famille monoparentale. Et apparemment, je ne suis pas la seule à vivre ça. Et si ça se passe bien, promis, j’enverrai une carte postale à mes ex pour les remercier de l’inspiration. Merci.',100,30,'images/fatn1.jpg','https://www.wanaut.com/a/faten-wehbe-on-fait-quoi-maintenant-stand-up-comedy']
];
function dateFor(date){const d=new Date(`${date}T12:00:00`);return `${d.getDate()} ${d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase()} · ${d.toLocaleDateString('en-GB',{month:'short'}).toUpperCase()}`}
document.querySelector('#showList').innerHTML=shows.map((show,index)=>`<article class="show"><button class="show-head" aria-expanded="false"><span class="s-date"><b>${dateFor(show[0]).split(' ')[0]}</b><span>${dateFor(show[0]).slice(2)}</span></span><span class="s-main"><span class="s-artist">${show[1]}</span><span class="s-tag">${show[2]}</span></span><span class="s-status"><span class="st ${show[5]===0?'st-sold':''}">${show[5]===0?'SOLD OUT':show[5]<=12?'ONLY '+show[5]+' LEFT':'AVAILABLE'}</span></span><span class="s-price">${show[4]===0?'FREE':show[4]+' MAD'}</span><span class="s-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v12M2 8h12"/></svg></span></button><div class="show-body"><div class="show-body-in">${show[6]?'<div class="show-content"><img class="show-image" src="'+show[6]+'" alt="'+show[1]+'"><p class="show-desc">'+show[3]+'</p></div>':'<p class="show-desc">'+show[3]+'</p>'}<div class="s-actions"><span class="s-times">DOORS 19:30 · FIRST SET 20:30</span>${show[5]===0?'<button class="btn" type="button">Join the waitlist</button>':show[7]?'<a class="btn" href="'+show[7]+'" target="_blank" rel="noopener noreferrer">Buy tickets · '+(show[4]===0?'FREE':show[4]+' MAD')+'</a>':'<a class="btn" href="reservation.html?event='+index+'">Reserve · '+(show[4]===0?'FREE':show[4]+' MAD')+'</a>'}</div></div></div></article>`).join('');
document.querySelector('#showList').addEventListener('click',event=>{const head=event.target.closest('.show-head');if(!head)return;const body=head.nextElementSibling;const open=head.getAttribute('aria-expanded')==='true';document.querySelectorAll('.show-head[aria-expanded=true]').forEach(item=>{item.setAttribute('aria-expanded','false');item.nextElementSibling.style.maxHeight='0'});if(!open){head.setAttribute('aria-expanded','true');body.style.maxHeight=body.scrollHeight+'px'}});
</script>
<script>const pageHeader=document.querySelector('.site-head');let headerScrollAnchor=window.scrollY;window.addEventListener('scroll',()=>{const currentScroll=window.scrollY;const movement=currentScroll-headerScrollAnchor;if(currentScroll<=12||movement<-8){pageHeader.classList.remove('nav-hidden');headerScrollAnchor=currentScroll}else if(movement>8){pageHeader.classList.add('nav-hidden');headerScrollAnchor=currentScroll}},{passive:true});</script>
</body>
</html>
